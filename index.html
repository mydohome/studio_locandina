<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Smile Editor V2</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Kalam:wght@700&family=Nunito:wght@800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1f5;font-family:Nunito,Arial;color:#17324d}.app{display:grid;grid-template-columns:390px 1fr;min-height:100vh}.panel{height:100vh;overflow:auto;background:#fff;padding:20px;box-shadow:2px 0 18px #0002;z-index:3}.panel h2{margin:0}.hint{font-size:12px;color:#687b8d;line-height:1.45;margin:5px 0 14px}label{font-size:12px;font-weight:900;display:block;margin:9px 0 3px}input{width:100%;padding:9px;border:1px solid #d7e0e8;border-radius:9px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pal{text-align:center;font-size:10px;font-weight:900;cursor:pointer}.thumb{height:68px;border-radius:8px;background-size:cover;background-position:center;border:2px solid white;box-shadow:0 0 0 1px #ccd}.pal.active .thumb{outline:3px solid #222}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}button{padding:10px;border:0;border-radius:9px;background:#075da8;color:#fff;font-weight:900;cursor:pointer}.secondary{background:#687c8f}.stage{display:flex;justify-content:center;padding:24px;overflow:auto}.sheet{width:min(768px,calc(100vw - 440px));aspect-ratio:2/3;filter:drop-shadow(0 18px 38px #0003)}svg{width:100%;height:100%;display:block}.note{margin-top:12px;padding:9px;background:#f2f6fa;border-radius:9px;font-size:11px;line-height:1.4}@media(max-width:900px){.app{grid-template-columns:1fr}.panel{height:auto}.sheet{width:min(96vw,768px)}.stage{padding:8px}}
</style></head><body><div class="app"><aside class="panel"><h2>Family Smile — Editor V2</h2><div class="hint">Motore riscritto in <b>SVG vettoriale</b>. Il testo viene ingrandito fino a riempire la sua area grafica e ridotto solo quando serve.</div>
<label>Palette</label><div class="pals" id="pals"></div><div class="row"><div><label>Mese</label><input data-id="month" value="Ottobre"></div><div><label>Periodo</label><input data-id="dates" value="dal 01 al 31 Ottobre"></div></div><label>Campagna</label><input data-id="offer" value="Sorriso In Salute"><div class="row"><div><label>Prestazione 1</label><input data-id="service1" value="Check-up dentistico completo"></div><div><label>Prestazione 2</label><input data-id="service2" value="Ortopanoramica"></div></div><label>Nota</label><input data-id="desc" value="inclusi nella seduta di igiene"><div class="row"><div><label>Prezzo</label><input data-id="price" value="90€"></div><div><label>WhatsApp</label><input data-id="phone" value="3471234567"></div></div><label>Indirizzo</label><input data-id="address" value="Via Sono Prova 19"><div class="actions"><button id="png">PNG HD</button><button id="pdf">PDF A4</button><button class="secondary" id="save">Salva preset</button><button class="secondary" onclick="location.reload()">Ripristina</button></div><div class="note">Auto-fit basato su <b>SVG getBBox()</b>: non dipende dalla dimensione dello schermo o dai pixel CSS.</div></aside>
<main class="stage"><div class="sheet"><svg id="poster" viewBox="0 0 1024 1536" xmlns="http://www.w3.org/2000/svg">
<image id="master" href="/assets/templates/fucsia.jpg" width="1024" height="1536" preserveAspectRatio="none"/>
<rect x="252" y="316" width="532" height="128" fill="#fff"/><rect x="268" y="690" width="510" height="62" rx="18" fill="#fff"/><rect id="offerMask" x="122" y="783" width="706" height="92" fill="#ef0069"/><rect x="166" y="1002" width="225" height="100" fill="#fff"/><rect x="431" y="1016" width="287" height="84" fill="#fff"/><rect x="176" y="1110" width="527" height="61" fill="#fff"/><ellipse cx="846" cy="1055" rx="87" ry="88" fill="#ffe12e"/><rect x="649" y="1261" width="272" height="65" fill="#0871bd"/><rect x="491" y="1403" width="424" height="65" rx="18" fill="#fff"/>
<g text-anchor="middle" dominant-baseline="middle">
<text id="month" x="518" y="380" fill="#ef0069" font-family="Caveat Brush,Kalam,cursive">Ottobre</text>
<text id="dates" x="523" y="721" fill="#ef0069" font-family="Kalam,cursive">dal 01 al 31 Ottobre</text>
<text id="offer" x="475" y="829" fill="#fff" font-family="Caveat Brush,Kalam,cursive">Sorriso In Salute</text>
<text id="service1" x="278" y="1052" fill="#07549b" font-family="Caveat Brush,Kalam,cursive">Check-up dentistico completo</text>
<text id="service2" x="574" y="1058" fill="#07549b" font-family="Caveat Brush,Kalam,cursive">Ortopanoramica</text>
<text id="desc" x="439" y="1140" fill="#ef0069" font-family="Caveat Brush,Kalam,cursive">inclusi nella seduta di igiene</text>
<text id="price" x="846" y="1055" fill="#ef0069" font-family="Permanent Marker,sans-serif">90€</text>
<text id="phone" x="785" y="1293" fill="#fff" font-family="Caveat Brush,Kalam,cursive">3471234567</text>
<text id="address" x="703" y="1436" fill="#07549b" font-family="Nunito,Arial" font-weight="900">Via Sono Prova 19</text></g>
</svg></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script>
const C={month:[532,128,42,122],dates:[510,62,22,58],offer:[706,92,38,98],service1:[225,100,20,70],service2:[287,84,22,68],desc:[527,61,22,58],price:[174,176,44,128],phone:[272,65,26,66],address:[424,65,22,50]};
const T={fucsia:['fucsia.jpg','#ef0069'],blu:['blu.jpg','#137bc3'],acqua:['acqua.jpg','#0aa99b'],arancio:['arancio.jpg','#f06a21'],viola:['viola.jpg','#9a2bd1']},N={fucsia:'Fucsia',blu:'Blu',acqua:'Acqua',arancio:'Arancio',viola:'Viola'};let current='fucsia';
Object.keys(T).forEach((k,i)=>{let d=document.createElement('div');d.className='pal'+(i?'':' active');d.innerHTML=`<div class="thumb" style="background-image:url('/assets/templates/${T[k][0]}')"></div>${N[k]}`;d.onclick=()=>setTheme(k,d);pals.appendChild(d)});
function setTheme(k,d){current=k;master.setAttribute('href','/assets/templates/'+T[k][0]);offerMask.setAttribute('fill',T[k][1]);['month','dates','desc','price'].forEach(id=>document.getElementById(id).setAttribute('fill',T[k][1]));document.querySelectorAll('.pal').forEach(x=>x.classList.remove('active'));d&&d.classList.add('active')}
function fit(id){let e=document.getElementById(id),[w,h,min,max]=C[id],lo=min,hi=max,best=min;for(let i=0;i<16;i++){let s=(lo+hi)/2;e.setAttribute('font-size',s);let b=e.getBBox();if(b.width<=w-16&&b.height<=h-10){best=s;lo=s}else hi=s}e.setAttribute('font-size',best)}
async function fitAll(){await document.fonts.ready;Object.keys(C).forEach(fit)}
document.querySelectorAll('[data-id]').forEach(i=>i.oninput=e=>{let id=e.target.dataset.id;document.getElementById(id).textContent=e.target.value;fit(id)});
window.onload=fitAll;setTheme('fucsia',document.querySelector('.pal'));
async function raster(scale=3){await document.fonts.ready;await fitAll();let s=new XMLSerializer().serializeToString(poster),u=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'})),im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=u});let c=document.createElement('canvas');c.width=1024*scale;c.height=1536*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return c}
png.onclick=async()=>{let c=await raster(),a=document.createElement('a');a.download='family-smile-HD.png';a.href=c.toDataURL('image/png');a.click()};
pdf.onclick=async()=>{let c=await raster(),{jsPDF}=window.jspdf,p=new jsPDF({unit:'mm',format:'a4'});p.addImage(c.toDataURL('image/jpeg',.98),'JPEG',0,0,210,297);p.save('family-smile-A4.pdf')};
save.onclick=()=>{let d={theme:current,values:{}};document.querySelectorAll('[data-id]').forEach(i=>d.values[i.dataset.id]=i.value);localStorage.setItem('fs-v2',JSON.stringify(d));alert('Preset salvato')};
</script></body></html>
