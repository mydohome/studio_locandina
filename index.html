<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Smile Master Editor</title>
<style>
:root{--theme:#f30070;--blue:#0964ae;--yellow:#ffdf25}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#edf1f5;color:#17324d}.app{display:grid;grid-template-columns:370px 1fr;min-height:100vh}.panel{height:100vh;overflow:auto;background:#fff;padding:20px;box-shadow:2px 0 18px #0002;z-index:5}.panel h2{margin:0 0 5px}.hint{font-size:12px;color:#66788a;margin-bottom:14px;line-height:1.4}label{font-size:12px;font-weight:800;display:block;margin:10px 0 4px}input,select{width:100%;padding:9px;border:1px solid #d7e0e8;border-radius:9px}.palettes{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.pal{cursor:pointer;text-align:center;font-size:10px;font-weight:800}.thumb{height:78px;border-radius:8px;background-size:cover;background-position:center;border:2px solid #fff;box-shadow:0 0 0 1px #ccd}.pal.active .thumb{outline:3px solid #111}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}button{padding:10px;border:0;border-radius:9px;background:#075da8;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#66798a}
.stage{display:flex;justify-content:center;align-items:flex-start;padding:24px;overflow:auto}.poster{position:relative;width:min(768px,calc(100vw - 430px));aspect-ratio:2/3;background:url('/assets/templates/fucsia.jpg') center/100% 100% no-repeat;box-shadow:0 18px 40px #0003;overflow:hidden}.overlay{position:absolute;display:none;text-align:center;font-weight:900;line-height:1.02}.overlay.on{display:flex;align-items:center;justify-content:center}.brushWhite{background:#fff;color:var(--theme);clip-path:polygon(2% 15%,97% 4%,100% 87%,4% 96%)}.brushBlue{background:var(--blue);color:#fff;clip-path:polygon(1% 7%,98% 0,100% 90%,3% 100%)}.plainWhite{background:#fff;color:var(--theme);border-radius:18px}.priceMask{background:var(--yellow);color:var(--theme);border-radius:50%}.contactMask{background:var(--blue);color:#fff;border-radius:18px}.addressMask{background:#fff;color:#07549b;border-radius:18px}
#monthO{left:17%;top:18.0%;width:66%;height:12%;font-size:clamp(28px,6vw,64px)}
#dateO{left:17%;top:45.1%;width:61%;height:5.3%;font-size:clamp(14px,2.5vw,27px)}
#offerO{left:8%;top:50.7%;width:78%;height:7%;font-size:clamp(23px,4vw,46px);color:#fff}
#serviceO{left:5.5%;top:63.3%;width:72%;height:14.7%;font-size:clamp(14px,2.4vw,27px);padding:3%;color:#07549b;background:#fff;border-radius:12px}
#serviceO small{display:block;color:var(--theme);margin-top:7%;font-size:.72em}
#priceO{left:73.5%;top:63.0%;width:20%;aspect-ratio:1;font-size:clamp(28px,5vw,58px)}
#ctaO{left:4%;top:82.0%;width:39%;height:7%;font-size:clamp(18px,3vw,34px)}
#phoneO{left:43.5%;top:82.1%;width:49%;height:6.8%;font-size:clamp(15px,2.5vw,28px)}
#addressO{left:38%;top:91.0%;width:55%;height:5.2%;font-size:clamp(12px,2vw,22px)}
@media(max-width:900px){.app{grid-template-columns:1fr}.panel{height:auto}.poster{width:min(94vw,768px)}.stage{padding:10px}}
</style></head><body>
<div class="app"><aside class="panel"><h2>Family Smile — Master Editor</h2>
<div class="hint"><b>Il master grafico è l'immagine approvata.</b> All'apertura non viene ricostruita: viene mostrata identica. Un campo viene coperto e ridisegnato solo quando lo modifichi.</div>
<label>Variante colore</label><div class="palettes" id="palettes"></div>
<label>Mese</label><input data-field="month" value="Ottobre"><label>Periodo</label><input data-field="date" value="dal 01 al 31 Ottobre">
<label>Campagna</label><input data-field="offer" value="Sorriso In Salute"><label>Prestazione</label><input data-field="service" value="Check-up dentistico completo + Ortopanoramica">
<label>Descrizione</label><input data-field="desc" value="inclusi nella seduta di igiene"><label>Prezzo</label><input data-field="price" value="90€">
<label>WhatsApp</label><input data-field="phone" value="3471234567"><label>Indirizzo</label><input data-field="address" value="Via Sono Prova 19">
<div class="actions"><button id="pngBtn">PNG HD</button><button id="pdfBtn">PDF A4</button><button class="secondary" id="resetBtn">Ripristina master</button><button class="secondary" id="saveBtn">Salva preset</button></div></aside>
<main class="stage"><div class="poster" id="poster">
<div class="overlay brushWhite" id="monthO"></div><div class="overlay plainWhite" id="dateO"></div><div class="overlay" id="offerO"></div>
<div class="overlay" id="serviceO"><div><span id="serviceTxt"></span><small id="descTxt"></small></div></div>
<div class="overlay priceMask" id="priceO"></div><div class="overlay brushWhite" id="ctaO">Prenota subito!</div>
<div class="overlay contactMask" id="phoneO"></div><div class="overlay addressMask" id="addressO"></div>
</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script>
const themes={
 fucsia:{file:'fucsia.jpg',theme:'#f30070',blue:'#0964ae',yellow:'#ffdf25'},
 blu:{file:'blu.jpg',theme:'#137bc3',blue:'#063f7d',yellow:'#ffdf25'},
 acqua:{file:'acqua.jpg',theme:'#0aa99b',blue:'#08727b',yellow:'#ffda35'},
 arancio:{file:'arancio.jpg',theme:'#f06a21',blue:'#a8401c',yellow:'#ffe13d'},
 viola:{file:'viola.jpg',theme:'#9a2bd1',blue:'#54258a',yellow:'#ffdf25'}
};
let current='fucsia', dirty={};
const labels={fucsia:'Fucsia',blu:'Blu',acqua:'Acqua',arancio:'Arancio',viola:'Viola'};
Object.entries(themes).forEach(([k,t],i)=>{let d=document.createElement('div');d.className='pal'+(i===0?' active':'');d.innerHTML=`<div class="thumb" style="background-image:url('/assets/templates/${t.file}')"></div><div>${labels[k]}</div>`;d.onclick=()=>applyTheme(k,d);palettes.appendChild(d)});
function applyTheme(k,d){current=k;let t=themes[k];poster.style.backgroundImage=`url('/assets/templates/${t.file}')`;document.documentElement.style.setProperty('--theme',t.theme);document.documentElement.style.setProperty('--blue',t.blue);document.documentElement.style.setProperty('--yellow',t.yellow);document.querySelectorAll('.pal').forEach(x=>x.classList.remove('active'));d?.classList.add('active')}
function activate(field,val){
 dirty[field]=true;
 if(field==='month'){monthO.textContent=val;monthO.classList.add('on')}
 if(field==='date'){dateO.textContent=val;dateO.classList.add('on')}
 if(field==='offer'){offerO.textContent=val;offerO.classList.add('on')}
 if(field==='service'){serviceTxt.textContent=val;serviceO.classList.add('on')}
 if(field==='desc'){descTxt.textContent=val;serviceO.classList.add('on')}
 if(field==='price'){priceO.textContent=val;priceO.classList.add('on')}
 if(field==='phone'){phoneO.textContent='☎  '+val;phoneO.classList.add('on')}
 if(field==='address'){addressO.textContent='📍  '+val;addressO.classList.add('on')}
}
document.querySelectorAll('[data-field]').forEach(i=>i.addEventListener('input',e=>activate(e.target.dataset.field,e.target.value)));
resetBtn.onclick=()=>{dirty={};document.querySelectorAll('.overlay').forEach(x=>x.classList.remove('on'));document.querySelectorAll('[data-field]').forEach(x=>x.value={month:'Ottobre',date:'dal 01 al 31 Ottobre',offer:'Sorriso In Salute',service:'Check-up dentistico completo + Ortopanoramica',desc:'inclusi nella seduta di igiene',price:'90€',phone:'3471234567',address:'Via Sono Prova 19'}[x.dataset.field]);applyTheme('fucsia',document.querySelector('.pal'))}
async function capture(scale=3){return html2canvas(poster,{scale,useCORS:true,backgroundColor:null})}
pngBtn.onclick=async()=>{let c=await capture(3),a=document.createElement('a');a.download='family-smile-volantino-HD.png';a.href=c.toDataURL('image/png',1);a.click()}
pdfBtn.onclick=async()=>{let c=await capture(3),{jsPDF}=window.jspdf,p=new jsPDF({unit:'mm',format:'a4'});p.addImage(c.toDataURL('image/jpeg',.98),'JPEG',0,0,210,297);p.save('family-smile-volantino-A4.pdf')}
saveBtn.onclick=()=>{let data={theme:current,dirty,values:{}};document.querySelectorAll('[data-field]').forEach(x=>data.values[x.dataset.field]=x.value);localStorage.setItem('fsMasterPreset',JSON.stringify(data));alert('Preset salvato nel browser')}
</script></body></html>
